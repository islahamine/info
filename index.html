<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Cours</title>
<style>
  :root {
    --bg: #f4f5f9; --card-bg: #ffffff; --text: #1a1a2e;
    --muted: #6b7280; --accent: #4f46e5; --accent2: #059669;
    --border: #e8e9ee; --shadow: 0 1px 2px rgba(20,20,40,0.06), 0 1px 6px rgba(20,20,40,0.04);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 17px; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--card-bg); color: var(--text);
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 10;
  }
  header img.logo { width: 54px; height: 54px; object-fit: contain; flex-shrink: 0; }
  header .school-info { flex: 1; text-align: center; min-width: 0; }
  header .school-info .college-name { font-size: 0.95rem; font-weight: 700; line-height: 1.2; }
  header .school-info .app-title { font-size: 0.78rem; color: var(--muted); margin-top: 1px; }

  main { padding: 16px; padding-bottom: 40px; max-width: 480px; margin: 0 auto; }

  /* ---- Levels ---- */
  .levels { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  .level-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); padding: 18px; display: flex; align-items: center; gap: 14px;
    cursor: pointer; user-select: none; contain: layout style;
    transition: transform 0.1s ease;
  }
  .level-card:active { transform: scale(0.98); background: #f0f0f7; }
  .badge {
    width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 1.25rem; font-weight: 700; color: white; flex-shrink: 0;
  }
  .b1 { background: #4f46e5; } .b2 { background: #059669; } .b3 { background: #ea580c; }
  .level-card .txt h2 { margin: 0 0 2px; font-size: 1.1rem; }
  .level-card .txt p { margin: 0; color: var(--muted); font-size: 0.87rem; }
  .level-card .txt p .count { color: var(--accent); font-weight: 600; }
  .level-card .arrow { margin-left: auto; color: var(--muted); font-size: 1.3rem; }

  /* ---- Back + search ---- */
  .back-btn {
    display: flex; align-items: center; gap: 6px; background: none; border: none;
    color: var(--accent); font-size: 1rem; font-weight: 600; cursor: pointer;
    padding: 8px 0; margin-bottom: 6px;
  }
  .search-wrap { position: sticky; top: 66px; background: var(--bg); padding: 6px 0 12px; z-index: 5; }
  .search-wrap input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 12px; font-size: 1rem; background: var(--card-bg); color: var(--text);
  }

  /* ---- Course list ---- */
  .list { display: flex; flex-direction: column; gap: 9px; }
  .course-item {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); padding: 14px; display: flex; align-items: center; gap: 12px;
    cursor: pointer; user-select: none; contain: layout style; content-visibility: auto;
    transition: transform 0.1s ease;
  }
  .course-item:active { transform: scale(0.98); background: #f0f0f7; }
  .subj-icon {
    width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; font-size: 1.2rem; background: #eef0fb; flex-shrink: 0;
  }
  .course-item .txt { flex: 1; min-width: 0; }
  .unit-group { margin-bottom: 22px; }
  .unit-heading {
    display: flex; align-items: flex-start; gap: 9px; margin: 0 0 10px;
    padding: 10px 12px; border-radius: 12px; background: #eef0fb; color: var(--text);
    border-left: 5px solid var(--accent);
  }
  .unit-heading .unit-icon { font-size: 1.25rem; line-height: 1.3; }
  .unit-heading h2 { margin: 0; font-size: 1.08rem; line-height: 1.3; }
  .subject-tag { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); font-weight: 700; }
  .course-item h3 { margin: 2px 0 0; font-size: 1rem; line-height: 1.3; }
  .course-item .arrow { color: var(--muted); font-size: 1.3rem; flex-shrink: 0; }
  .new-badge {
    display: inline-block; background: #dc2626; color: white; font-size: 0.62rem;
    font-weight: 700; padding: 2px 7px; border-radius: 6px; margin-left: 7px;
    letter-spacing: 0.03em; vertical-align: middle;
  }
  .date-text { font-size: 0.75rem; color: var(--muted); margin-top: 3px; }

  /* ---- Club Robotique ---- */
  .b4 { background: #0891b2; }
  .card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .grid-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); overflow: hidden; cursor: pointer; user-select: none;
    transition: transform 0.1s ease;
  }
  .grid-card:active { transform: scale(0.98); }
  .grid-card h3 { margin: 0; font-size: 1rem; line-height: 1.3; overflow-wrap: anywhere; }
  .grid-body { padding: 12px; }
  .grid-body .new-badge { margin: 6px 0 0; }
  .seance-cover {
    position: relative; aspect-ratio: 16 / 10; background: linear-gradient(135deg, #0891b2, #4f46e5);
    display: flex; align-items: center; justify-content: center; font-size: 2.2rem;
  }
  .seance-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .club-title { margin: 2px 0 12px; font-size: 1.3rem; line-height: 1.25; }
  .seance-desc { white-space: pre-wrap; margin: 10px 0 0; }
  #seanceTitle { margin-bottom: 2px; }
  #taskGrid { margin-top: 16px; }
  .task-card { border-top: 5px solid var(--task-color); }
  .task-icon { font-size: 1.6rem; padding: 12px 12px 0; }
  .task-card .grid-body { padding-top: 6px; }
  .task-type { display: block; font-size: 0.75rem; font-weight: 700; color: var(--task-color); margin-bottom: 3px; }
  .type-tutoriel { --task-color: #4f46e5; }
  .type-exercice { --task-color: #059669; }
  .type-lien { --task-color: #0891b2; }
  .type-info { --task-color: #ea580c; }
  .task-text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 14px; }
  .task-link {
    display: block; text-align: center; text-decoration: none; background: var(--accent); color: white;
    padding: 13px; border-radius: 12px; font-weight: 600; margin-bottom: 14px;
  }
  .task-image { margin-bottom: 14px; }
  .task-image img { display: block; width: 100%; border-radius: 12px; background: #eef0f4; }
  .task-image a { display: block; text-align: center; padding: 8px; color: var(--accent); font-size: 0.9rem; font-weight: 600; text-decoration: none; }
  .task-file {
    display: block; border: 1px solid var(--border); border-radius: 12px; padding: 13px; margin-bottom: 10px;
    color: var(--text); text-decoration: none; font-weight: 600; overflow-wrap: anywhere;
  }

  .empty-state, .error-state { text-align: center; color: var(--muted); padding: 50px 20px; }

  /* ---- Skeleton loading ---- */
  .skeleton-row {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 9px;
  }
  .skeleton-block { background: #e8e9ee; border-radius: 8px; animation: pulse 1.1s ease-in-out infinite; }
  .skeleton-row .skeleton-block:first-child { width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; }
  .skeleton-lines { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .skeleton-lines .skeleton-block:nth-child(1) { width: 40%; height: 9px; }
  .skeleton-lines .skeleton-block:nth-child(2) { width: 75%; height: 13px; }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* ---- Bottom sheet ---- */
  .sheet-overlay { display: none; position: fixed; inset: 0; background: rgba(20,20,40,0.45); z-index: 50; }
  .sheet-overlay.open { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card-bg);
    border-radius: 20px 20px 0 0; padding: 20px 18px calc(24px + env(safe-area-inset-bottom, 0px));
    max-height: 85vh; overflow-y: auto;
    transform: translateY(100%); transition: transform 0.22s ease-out;
  }
  .sheet-overlay.open .sheet { transform: translateY(0); }
  .sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 16px; }
  .sheet h3 { margin: 0 0 4px; font-size: 1.15rem; }
  .sheet .subject-tag { display: block; margin-bottom: 18px; }

  .download-row {
    display: flex; align-items: center; gap: 14px; border: 1px solid var(--border);
    border-radius: 14px; padding: 14px; margin-bottom: 12px;
  }
  .download-row img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: #eef0f4; flex-shrink: 0; }
  .download-row .label { flex: 1; font-weight: 600; font-size: 1rem; }
  .download-row a.btn {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    color: white; padding: 10px 16px; border-radius: 10px; font-size: 0.9rem; font-weight: 600;
    transition: filter 0.1s ease;
  }
  .download-row a.btn:active { filter: brightness(0.9); }
  .download-row.course a.btn { background: var(--accent); }
  .download-row.exercise a.btn { background: var(--accent2); }
  .download-row.missing { opacity: 0.5; }
  .download-row a.btn.disabled { background: var(--muted) !important; pointer-events: none; }
  .download-row.print { border-style: dashed; margin-top: -4px; }
  .download-row.print a.btn { background: #475569; }

  .sheet-close {
    display: block; width: 100%; text-align: center; padding: 12px;
    background: none; border: none; color: var(--muted); font-size: 0.95rem; margin-top: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14151f; --card-bg: #1e2030; --text: #e5e7eb; --muted: #9ca3af; --border: #2e3040;
      --shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
    .level-card:active, .course-item:active { background: #262842; }
    .subj-icon, .unit-heading { background: #262842; }
    .skeleton-block { background: #2a2c40; }
  }
  :root[data-theme="dark"] .unit-heading { background: #262842; }
  :root[data-theme="dark"] {
    --bg: #14151f; --card-bg: #1e2030; --text: #e5e7eb; --muted: #9ca3af; --border: #2e3040;
  }
</style>
</head>
<body>

<header>
  <img class="logo" src="assets/logo-ministere.png" alt="" onerror="this.style.display='none'">
  <div class="school-info">
    <div class="college-name">Collège Prince Moulay Rachid</div>
    <div class="app-title">📚 Plateforme des cours</div>
  </div>
  <img class="logo" src="assets/logo-college.png" alt="" onerror="this.style.display='none'">
</header>

<main>
  <div class="levels" id="levelScreen">
    <div class="level-card" data-level="1APIC">
      <span class="badge b1">1</span>
      <span class="txt"><h2>1APIC</h2><p>1ère année<span class="count" id="count-1APIC"></span></p></span>
      <span class="arrow">›</span>
    </div>
    <div class="level-card" data-level="2APIC">
      <span class="badge b2">2</span>
      <span class="txt"><h2>2APIC</h2><p>2ème année<span class="count" id="count-2APIC"></span></p></span>
      <span class="arrow">›</span>
    </div>
    <div class="level-card" data-level="3APIC">
      <span class="badge b3">3</span>
      <span class="txt"><h2>3APIC</h2><p>3ème année<span class="count" id="count-3APIC"></span></p></span>
      <span class="arrow">›</span>
    </div>
    <div class="level-card" id="clubCard">
      <span class="badge b4">🤖</span>
      <span class="txt"><h2>Club Robotique</h2><p>Tous les niveaux<span class="count" id="count-club"></span></p></span>
      <span class="arrow">›</span>
    </div>
  </div>

  <div id="courseScreen" style="display:none;">
    <button class="back-btn" id="backBtn">‹ Niveaux</button>
    <div class="search-wrap"><input type="text" id="searchInput" placeholder="Rechercher..."></div>
    <div class="list" id="courseList"></div>
    <div class="empty-state" id="emptyState" style="display:none;">Aucun cours trouvé.</div>
  </div>

  <div id="clubScreen" style="display:none;">
    <button class="back-btn" id="clubBack">‹ Accueil</button>
    <h2 class="club-title">🤖 Club Robotique</h2>
    <div class="card-grid" id="seanceGrid"></div>
    <div class="empty-state" id="clubEmpty" style="display:none;"></div>
  </div>

  <div id="seanceScreen" style="display:none;">
    <button class="back-btn" id="seanceBack">‹ Séances</button>
    <h2 class="club-title" id="seanceTitle"></h2>
    <div class="date-text" id="seanceDate"></div>
    <p class="seance-desc" id="seanceDesc"></p>
    <div class="card-grid" id="taskGrid"></div>
    <div class="empty-state" id="seanceEmpty" style="display:none;">Aucune tâche pour le moment.</div>
  </div>
</main>

<div class="sheet-overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="modalTitle"></h3>
    <span class="subject-tag" id="modalSubject"></span>
    <div class="date-text" id="modalDate" style="margin-bottom:14px;"></div>

    <div class="download-row course">
      <img id="modalCourseImg" alt="" decoding="async" onerror="this.style.visibility='hidden'">
      <span class="label">📘 Cours</span>
      <a class="btn" id="modalCourseLink" download>⬇</a>
    </div>
    <div id="coursePrintContainer"></div>
    <div class="download-row exercise">
      <img id="modalExerciseImg" alt="" decoding="async" onerror="this.style.visibility='hidden'">
      <span class="label">✏️ Exercices</span>
      <a class="btn" id="modalExerciseLink" download>⬇</a>
    </div>
    <div id="exercisePrintContainer"></div>

    <button class="sheet-close" id="modalClose">Fermer</button>
  </div>
</div>

<div class="sheet-overlay" id="taskOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="taskTitle"></h3>
    <span class="subject-tag" id="taskType"></span>
    <p class="task-text" id="taskText"></p>
    <a class="task-link" id="taskLink" target="_blank" rel="noopener">🔗 Ouvrir le lien</a>
    <div id="taskMedia"></div>
    <button class="sheet-close" id="taskClose">Fermer</button>
  </div>
</div>

<script>
  let allData = {};
  let currentLevel = null;
  let loadFailed = false;
  let dataReady = false;

  const levelScreen = document.getElementById('levelScreen');
  const courseScreen = document.getElementById('courseScreen');
  const list = document.getElementById('courseList');
  const emptyState = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');
  const overlay = document.getElementById('overlay');

  function unitsFor(level) { return (allData.units && allData.units[level]) || []; }
  function unitOf(level, c) {
    return unitsFor(level).find(u => u.id === c.unit) || { id: 'autres', title: c.subject || 'Autres cours' };
  }
  function courseNumber(c) {
    const m = (c.title || '').match(/cours\s*(\d+)/i);
    return m ? Number(m[1]) : Infinity;
  }
  function byCourseNumber(a, b) {
    return (courseNumber(a) - courseNumber(b)) || String(a.date || '').localeCompare(String(b.date || ''));
  }

  function formatDate(iso) {
    if (!iso) return '';
    try {
      return new Intl.DateTimeFormat('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }).format(new Date(iso));
    } catch (e) { return ''; }
  }

  function getViewedSet() {
    try { return new Set(JSON.parse(localStorage.getItem('viewedCourseIds') || '[]')); }
    catch (e) { return new Set(); }
  }
  function markViewed(id) {
    const set = getViewedSet();
    if (!set.has(id)) {
      set.add(id);
      localStorage.setItem('viewedCourseIds', JSON.stringify([...set]));
    }
  }

  function updateLevelCounts() {
    ['1APIC', '2APIC', '3APIC'].forEach(lvl => {
      const el = document.getElementById('count-' + lvl);
      if (el) el.textContent = loadFailed ? '' : ' • ' + (allData[lvl] || []).length + ' cours';
    });
  }

  function drawFavicon(count) {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, 64, 64);
    ctx.font = '52px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('📚', 30, 36);
    if (count > 0) {
      ctx.beginPath();
      ctx.arc(50, 16, 15, 0, Math.PI * 2);
      ctx.fillStyle = '#dc2626';
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText(count > 9 ? '9+' : String(count), 50, 17);
    }
    let link = document.querySelector("link[rel~='icon']");
    if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
    link.href = canvas.toDataURL('image/png');
  }

  function updateBadge() {
    const viewed = getViewedSet();
    let newCount = 0;
    ['1APIC', '2APIC', '3APIC'].forEach(lvl => {
      (allData[lvl] || []).forEach(c => { if (!viewed.has(c.id)) newCount++; });
    });
    newCount += unseenSeances();
    document.title = newCount > 0 ? `(${newCount}) Cours` : 'Cours';
    drawFavicon(newCount);
  }

  function showSkeleton() {
    list.innerHTML = Array(4).fill(`
      <div class="skeleton-row">
        <div class="skeleton-block"></div>
        <div class="skeleton-lines">
          <div class="skeleton-block"></div>
          <div class="skeleton-block"></div>
        </div>
      </div>`).join('');
  }

  async function loadData() {
    try {
      const res = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      allData = await res.json();
      loadFailed = false;
    } catch (e) {
      allData = {};
      loadFailed = true;
    }
    dataReady = true;
  }

  function refreshData() {
    dataReady = false;
    clubReady = false;
    return Promise.all([loadData(), loadClub()]).then(() => {
      updateLevelCounts();
      updateClubCount();
      updateBadge();
      if (currentLevel) renderCourses();
      if (clubOpen && clubScreen.style.display !== 'none') renderClub();
    });
  }

  function openLevel(level) {
    currentLevel = level;
    levelScreen.style.display = 'none';
    courseScreen.style.display = 'block';
    searchInput.value = '';
    if (loadFailed) refreshData();
    renderCourses();
  }

  function renderCourses() {
    if (!dataReady) {
      emptyState.style.display = 'none';
      showSkeleton();
      return;
    }
    const q = searchInput.value.trim().toLowerCase();
    const courses = (allData[currentLevel] || []).filter(c =>
      (c.title || '').toLowerCase().includes(q) || unitOf(currentLevel, c).title.toLowerCase().includes(q)
    );
    list.innerHTML = '';
    emptyState.style.display = courses.length === 0 ? 'block' : 'none';
    emptyState.textContent = loadFailed
      ? "Connexion impossible — vérifiez votre réseau et réessayez."
      : "Aucun cours trouvé.";

    const frag = document.createDocumentFragment();
    const viewed = getViewedSet();
    const groups = new Map();
    unitsFor(currentLevel).forEach(u => groups.set(u.id, { unit: u, courses: [] }));
    courses.forEach(c => {
      const unit = unitOf(currentLevel, c);
      if (!groups.has(unit.id)) groups.set(unit.id, { unit, courses: [] });
      groups.get(unit.id).courses.push(c);
    });

    groups.forEach(({ unit, courses: unitCourses }) => {
      if (unitCourses.length === 0) return;
      const group = document.createElement('section');
      group.className = 'unit-group';
      const heading = document.createElement('div');
      heading.className = 'unit-heading';
      heading.innerHTML = `
        <span class="unit-icon">${unit.id === 'corrections' ? '📝' : '📂'}</span>
        <h2></h2>`;
      heading.querySelector('h2').textContent = unit.title;
      group.appendChild(heading);
      const groupList = document.createElement('div');
      groupList.className = 'list';
      unitCourses.sort(byCourseNumber).forEach(c => {
      const isNew = !viewed.has(c.id);
      const item = document.createElement('div');
      item.className = 'course-item';
      item.innerHTML = `
        <span class="subj-icon">📄</span>
        <span class="txt">
          <h3>${c.title || 'Sans titre'}${isNew ? '<span class="new-badge">NOUVEAU</span>' : ''}</h3>
          ${c.date ? `<div class="date-text">${formatDate(c.date)}</div>` : ''}
        </span>
        <span class="arrow">›</span>`;
      item.addEventListener('click', () => openSheet(c));
      groupList.appendChild(item);
      });
      group.appendChild(groupList);
      frag.appendChild(group);
    });
    list.appendChild(frag);
  }

  function thumbPath(filePath) { return filePath.replace('images/', 'thumbs/') + '.jpg'; }

  function setDownloadRow(prefix, filePath) {
    const img = document.getElementById('modal' + prefix + 'Img');
    const link = document.getElementById('modal' + prefix + 'Link');
    const row = link.closest('.download-row');
    const hasFile = typeof filePath === 'string' && filePath.trim() !== '';

    if (hasFile) {
      img.style.visibility = 'visible';
      img.src = thumbPath(filePath);
      link.href = filePath;
      link.classList.remove('disabled');
      link.textContent = '⬇';
      link.removeAttribute('aria-disabled');
      row.classList.remove('missing');
      row.style.display = 'flex';
    } else {
      img.removeAttribute('src');
      link.removeAttribute('href');
      link.classList.remove('disabled');
      link.removeAttribute('aria-disabled');
      row.classList.remove('missing');
      row.style.display = 'none';
    }
  }

  function setOptionalRow(rowId, imgId, linkId, filePath) {
    // conservée pour compatibilité, plus utilisée directement
  }

  function renderPrintRows(containerId, files) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    if (!files || files.length === 0) return;
    const frag = document.createDocumentFragment();
    files.forEach((filePath, idx) => {
      if (!filePath) return;
      const row = document.createElement('div');
      row.className = 'download-row print';
      row.innerHTML = `
        <img alt="" decoding="async" src="${thumbPath(filePath)}" onerror="this.style.visibility='hidden'">
        <span class="label">📎 Image ${idx + 1} à coller</span>
        <a class="btn" href="${filePath}" download>⬇</a>`;
      frag.appendChild(row);
    });
    container.appendChild(frag);
  }

  function collectPrintFiles(c, pluralKey, singularKey) {
    const arr = Array.isArray(c[pluralKey]) ? c[pluralKey].filter(Boolean) : [];
    if (c[singularKey] && !arr.includes(c[singularKey])) arr.unshift(c[singularKey]);
    return arr;
  }

  function openSheet(c) {
    document.getElementById('modalTitle').textContent = c.title || 'Sans titre';
    document.getElementById('modalSubject').textContent = unitOf(currentLevel, c).title;
    document.getElementById('modalDate').textContent = c.date ? ('Ajouté le ' + formatDate(c.date)) : '';
    setDownloadRow('Course', c.courseFile);
    setDownloadRow('Exercise', c.exerciseFile);
    renderPrintRows('coursePrintContainer', collectPrintFiles(c, 'coursePrintFiles', 'coursePrintFile'));
    renderPrintRows('exercisePrintContainer', collectPrintFiles(c, 'exercisePrintFiles', 'exercisePrintFile'));
    overlay.classList.add('open');
    markViewed(c.id);
    renderCourses();
    updateBadge();
  }

  // ---- Club Robotique ----
  const TASK_TYPES = {
    tutoriel: { label: 'Tutoriel', icon: '📘', cls: 'type-tutoriel' },
    exercice: { label: 'Exercice', icon: '✏️', cls: 'type-exercice' },
    lien: { label: 'Lien', icon: '🔗', cls: 'type-lien' },
    info: { label: 'Information', icon: '💡', cls: 'type-info' }
  };
  const clubScreen = document.getElementById('clubScreen');
  const seanceScreen = document.getElementById('seanceScreen');
  const taskOverlay = document.getElementById('taskOverlay');
  let clubData = { seances: [] };
  let clubReady = false;
  let clubFailed = false;
  let clubOpen = false;

  async function loadClub() {
    try {
      const res = await fetch('robotique.json?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      clubData = await res.json();
      if (!Array.isArray(clubData.seances)) clubData.seances = [];
      clubFailed = false;
    } catch (e) {
      clubData = { seances: [] };
      clubFailed = true;
    }
    clubReady = true;
  }

  function seanceViewId(s) { return 'seance:' + s.id; }

  function updateClubCount() {
    const el = document.getElementById('count-club');
    if (el) el.textContent = clubFailed ? '' : ' • ' + clubData.seances.length + ' séance' + (clubData.seances.length > 1 ? 's' : '');
  }

  function unseenSeances() {
    const viewed = getViewedSet();
    return clubData.seances.filter(s => !viewed.has(seanceViewId(s))).length;
  }

  function openClub() {
    clubOpen = true;
    levelScreen.style.display = 'none';
    seanceScreen.style.display = 'none';
    clubScreen.style.display = 'block';
    if (clubFailed) refreshData();
    renderClub();
  }

  function renderClub() {
    const grid = document.getElementById('seanceGrid');
    const empty = document.getElementById('clubEmpty');
    grid.innerHTML = '';
    empty.style.display = 'none';
    if (!clubReady) {
      empty.textContent = 'Chargement...';
      empty.style.display = 'block';
      return;
    }
    if (clubFailed || clubData.seances.length === 0) {
      empty.textContent = clubFailed
        ? 'Connexion impossible — vérifiez votre réseau et réessayez.'
        : 'Aucune séance pour le moment.';
      empty.style.display = 'block';
      return;
    }
    const viewed = getViewedSet();
    [...clubData.seances]
      .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')))
      .forEach(s => {
        const card = document.createElement('div');
        card.className = 'grid-card';
        card.innerHTML = `
          <div class="seance-cover"><span>🤖</span></div>
          <div class="grid-body">
            <h3></h3>
            <div class="date-text"></div>
          </div>`;
        if (s.cover) {
          const img = document.createElement('img');
          img.src = s.cover;
          img.alt = '';
          img.loading = 'lazy';
          img.decoding = 'async';
          img.onerror = () => img.remove();
          card.querySelector('.seance-cover').appendChild(img);
        }
        card.querySelector('h3').textContent = s.title || 'Sans titre';
        card.querySelector('.date-text').textContent = formatDate(s.date);
        if (!viewed.has(seanceViewId(s))) {
          const badge = document.createElement('span');
          badge.className = 'new-badge';
          badge.textContent = 'NOUVEAU';
          card.querySelector('.grid-body').appendChild(badge);
        }
        card.addEventListener('click', () => openSeance(s));
        grid.appendChild(card);
      });
  }

  function openSeance(s) {
    markViewed(seanceViewId(s));
    updateBadge();
    clubScreen.style.display = 'none';
    seanceScreen.style.display = 'block';
    window.scrollTo(0, 0);
    document.getElementById('seanceTitle').textContent = s.title || 'Sans titre';
    document.getElementById('seanceDate').textContent = formatDate(s.date);
    const desc = document.getElementById('seanceDesc');
    desc.textContent = s.description || '';
    desc.style.display = s.description ? 'block' : 'none';

    const tasks = Array.isArray(s.tasks) ? s.tasks : [];
    const grid = document.getElementById('taskGrid');
    grid.innerHTML = '';
    document.getElementById('seanceEmpty').style.display = tasks.length === 0 ? 'block' : 'none';
    tasks.forEach(t => {
      const type = TASK_TYPES[t.type] || TASK_TYPES.info;
      const card = document.createElement('div');
      card.className = 'grid-card task-card ' + type.cls;
      card.innerHTML = `
        <div class="task-icon"></div>
        <div class="grid-body">
          <span class="task-type"></span>
          <h3></h3>
        </div>`;
      card.querySelector('.task-icon').textContent = type.icon;
      card.querySelector('.task-type').textContent = type.label;
      card.querySelector('h3').textContent = t.title || 'Sans titre';
      card.addEventListener('click', () => openTask(t));
      grid.appendChild(card);
    });
  }

  function openTask(t) {
    const type = TASK_TYPES[t.type] || TASK_TYPES.info;
    document.getElementById('taskTitle').textContent = t.title || 'Sans titre';
    document.getElementById('taskType').textContent = type.icon + ' ' + type.label;
    const text = document.getElementById('taskText');
    text.textContent = t.text || '';
    text.style.display = t.text ? 'block' : 'none';

    const link = document.getElementById('taskLink');
    const safeLink = typeof t.link === 'string' && /^https?:\/\//i.test(t.link);
    link.style.display = safeLink ? 'block' : 'none';
    if (safeLink) link.href = t.link; else link.removeAttribute('href');

    const media = document.getElementById('taskMedia');
    media.innerHTML = '';
    (t.images || []).forEach((path, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'task-image';
      const img = document.createElement('img');
      img.src = path;
      img.alt = 'Image ' + (i + 1);
      img.loading = 'lazy';
      img.decoding = 'async';
      const a = document.createElement('a');
      a.href = path;
      a.download = '';
      a.textContent = '⬇ Télécharger l\'image';
      wrap.appendChild(img);
      wrap.appendChild(a);
      media.appendChild(wrap);
    });
    (t.files || []).forEach(f => {
      const a = document.createElement('a');
      a.className = 'task-file';
      a.href = f.path;
      a.download = f.name || '';
      a.textContent = '📎 ' + (f.name || 'Fichier');
      media.appendChild(a);
    });
    taskOverlay.classList.add('open');
  }

  document.getElementById('clubCard').addEventListener('click', openClub);
  document.getElementById('clubBack').addEventListener('click', () => {
    clubOpen = false;
    clubScreen.style.display = 'none';
    levelScreen.style.display = 'flex';
  });
  document.getElementById('seanceBack').addEventListener('click', () => {
    seanceScreen.style.display = 'none';
    clubScreen.style.display = 'block';
    renderClub();
  });
  document.getElementById('taskClose').addEventListener('click', () => taskOverlay.classList.remove('open'));
  taskOverlay.addEventListener('click', (e) => { if (e.target === taskOverlay) taskOverlay.classList.remove('open'); });

  document.getElementById('modalClose').addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });

  document.getElementById('backBtn').addEventListener('click', () => {
    courseScreen.style.display = 'none';
    levelScreen.style.display = 'flex';
    currentLevel = null;
  });

  document.querySelectorAll('.level-card[data-level]').forEach(el => {
    el.addEventListener('click', () => openLevel(el.dataset.level));
  });

  searchInput.addEventListener('input', renderCourses);

  refreshData();
</script>

</body>
</html>
